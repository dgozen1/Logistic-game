</style>
</head>

function routeCities(v){
  if(!v.stops.length)return [];
  var res=[],cur=posOf(v),tm=tsOf(v),spd=vt(v).spd;
  v.stops.forEach(function(s,si){
    var target=P[s.c],totD=dp(cur,target);
    var between=[];
    P.forEach(function(p,idx){
      if(idx===s.c)return;
      if(si===0 && !v.leg && idx===v.loc)return;
      var d1=dp(cur,p),d2=dp(p,target);
      var detour=(d1+d2)-totD;
      if(d1>15 && d2>15 && (d1+d2)<=totD*1.03 && detour<=35){
        between.push({c:idx,d:d1,t:"pass",tm:tm+(d1/spd*60)});
      }
    });
    between.sort(function(a,b){return a.d-b.d});
    between.forEach(function(b){
      if(!res.some(function(x){return x.c===b.c && Math.abs(x.tm-b.tm)<60}))res.push(b);
    });
    tm+=totD/spd*60;
    res.push({c:s.c,t:s.t,j:s.j,tm:tm});
    cur=target;
  });
  return res;
}

  var v=S.vehicles.filter(function(x){return x.id===+s.dataset.id})[0];v.drv=s.value?+s.value:null;save();view()});
$("goload").onclick=function(){$("fin").click()};
$("fin").addEventListener("change",function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var st=parseSave(r.result);$("fin").value="";if(!st){toast("⚠ Geçerli bir Lojistik Oyunu kaydı değil");return}if(!S)applyLoad(st);else{pendLoad=st;view()}};r.readAsText(f)});
$("pz").onclick=function(){S.paused=!S.paused;$("pz").textContent=S.paused?"▶":"⏸"};
[].forEach.call(document.querySelectorAll("#ctrl [data-s]"),function(b){b.onclick=function(){
  S.speed=+b.dataset.s;[].forEach.call(document.querySelectorAll("#ctrl [data-s]"),function(x){x.classList.toggle("on",x===b)})}});
setInterval(function(){
  if(!S||S.paused||$("game").classList.contains("hide"))return;
  var dt=2*S.speed;S.vehicles.forEach(function(v){if(!v.stops.length||!v.leg)return;
    if(v.fuel<=0){
      var t=vt(v),refillCost=Math.round(t.tank*FR);
      S.money-=refillCost;S.st.fc+=refillCost;S.st.fl+=t.tank;v.fuel=t.tank;
      logm("⛽ "+t.short+" #"+v.id+" yakıtı bittiği için yolda otomatik ikmal yapıldı: -"+tl(refillCost));
      toast("⛽ Yakıt bitti! Otomatik ikmal yapıldı: -"+tl(refillCost));
    }
    var mn=Math.max(0,Math.min(S.t+dt,v.leg.t1)-Math.max(S.t,v.leg.t0)),e=vt(v),b=base(v),km=e.spd*mn/60,st=S.st;v.km+=km;v.fuel=Math.max(0,v.fuel-km*e.fuel/100);
    st.km+=km;st.xL+=km*b.fuel*(MODES[v.mode||0].f-1)/100;st.saved+=km*(60/b.spd-60/e.spd);var dv=S.drivers.filter(function(x){return x.id===v.drv})[0];if(dv)dv.km=(dv.km||0)+km;if(!v.rent&&over(v)===2&&S.t>=v.leg.t0&&Math.random()<.04*dt/60){var bp=posOf(v),bd=240,bc=svcCost(v)*2;S.money-=bc;S.st.svc+=bc;S.st.brk++;v.svc=v.km;v.leg={la:bp.la,lo:bp.lo,t0:S.t+bd,t1:v.leg.t1+bd};logm("🛠 Arıza: "+vt(v).short+" #"+v.id+" yolda bozuldu · onarım -"+tl(bc)+" · +4 sa");toast("🛠 "+vt(v).short+" #"+v.id+" arızalandı: -"+tl(bc)+" (+4 saat)")}});S.t+=dt;var day=Math.floor(S.t/1440),ch=false;
  if(day>S.lastDay){S.money-=wages()*(day-S.lastDay);S.st.wg+=wages()*(day-S.lastDay);for(var dd=S.lastDay+1;dd<=day;dd++)bankDay(dd);S.lastDay=day;newPool();ch=true}
  S.ships.forEach(function(sh){if(sh.atSea&&S.t>=sh.arr){sh.atSea=false;var earn=sh.earn||Math.round((sh.load||0)*4.5);S.money+=earn;S.earned+=earn;sh.load=0;sh.earn=0;var homePt=S.ports.filter(function(p){return p.id===sh.portId})[0];var baseSh=SHIPS.filter(function(x){return x.id===sh.model})[0];if(homePt&&homePt.cargo>0&&baseSh){var take=Math.min(baseSh.cap,homePt.cargo);sh.load=take;homePt.cargo-=take}logm("🚢 Dünya seferi tamamlandı, gelir: +"+tl(earn));toast("🚢 Gemi dünya seferinden döndü: +"+tl(earn));ch=true}});
  S.vehicles.forEach(function(v){
    while(v.stops.length&&v.leg&&v.fuel>0&&S.t>=v.leg.t1){ch=true;var s=v.stops.shift(),ta=v.leg.t1,j=s.j,q=P[s.c];v.loc=s.c;
      if(s.t==="p"){v.load+=j.kg;if(j.dep){var dpo=S.depots.filter(function(x){return x.id===j.dep})[0];if(dpo)dpo.items=dpo.items.filter(function(x){return x.id!==j.id})}logm("Yük alındı: "+q.n+(j.dep?" (depo)":"")+" ("+kg(j.kg)+") · araç #"+v.id)}
      else if(s.t==="w"){v.load-=j.kg;var dpw=S.depots.filter(function(x){return x.c===s.c})[0],it=Object.assign({},j);it.to=it.oto;delete it.oto;delete it.tw;it.at=ta;if(dpw)dpw.items.push(it);logm("🏬 Depoya teslim: "+q.n+" ("+kg(j.kg)+") → "+P[it.to].n);toast("🏬 "+q.n+" deposuna "+kg(j.kg)+" yük bırakıldı")}
      else if(s.t==="m"){logm("Boş sefer tamamlandı: "+q.n+" · araç #"+v.id)}
      else{
        v.load-=j.kg;
        if(j.tp){
          var portObj=S.ports.filter(function(p){return p.id===j.tp})[0];
          var ptMeta=PORTS.filter(function(x){return x.id===j.tp})[0];
          var landPay=Math.round(j.pay*0.6);
          S.money+=landPay;S.earned+=landPay;S.done++;
          if(portObj){
            var rem=j.kg;
            S.ships.forEach(function(sh){
              if(!sh.atSea && sh.portId===j.tp && rem>0){
                var bSh=SHIPS.filter(function(x){return x.id===sh.model})[0];
                var space=bSh.cap-(sh.load||0);
                if(space>0){var add=Math.min(space,rem);sh.load=(sh.load||0)+add;rem-=add;}
              }
            });
            portObj.cargo=(portObj.cargo||0)+rem;
          }
          logm("⚓ Limana teslim ("+(ptMeta?ptMeta.n:q.n)+"): "+kg(j.kg)+" gemiye/stoğa aktarıldı · +"+tl(landPay));
          toast("⚓ Limana "+kg(j.kg)+" yük teslim edildi ve gemiye yüklendi!");
        }else{
          var late=Math.max(0,Math.round(ta-j.due)),pn=Math.min(j.pay,Math.round(j.pay*j.pen/100*Math.ceil(late/60))),net=j.pay-pn;S.money+=net;S.earned+=net;S.done++;S.st.pen+=pn;if(pn)S.st.late++;else S.st.ontime++;S.st.gross+=j.pay;var dr=S.drivers.filter(function(x){return x.id===v.drv})[0];if(dr){dr.jobs=(dr.jobs||0)+1;dr.earned=(dr.earned||0)+net}logm(q.n+" teslim: +"+tl(net)+(pn?" (gecikme cezası -"+tl(pn)+")":""));toast("✅ "+q.n+" teslim: +"+tl(net)+(pn?" · gecikme cezası -"+tl(pn):"")+" · kasa "+tl(S.money))
        }
      }
      v.leg=null;if(v.stops.length){var vv=vt(v),dk=dp(q,P[v.stops[0].c]),t0=ta;if(dk*vv.fuel/100>v.fuel){var lt=vv.tank-v.fuel,ct=Math.round(lt*FP);S.money-=ct;S.st.fc+=ct;S.st.fl+=lt;v.fuel=vv.tank;t0=ta+10+lt/20;logm(vv.n+" #"+v.id+" otomatik ikmal ("+q.n+"): "+Math.round(lt)+" L · -"+tl(ct))}v.leg={la:q.la,lo:q.lo,t0:t0,t1:t0+dk/vv.spd*60}}
    }
    if(!v.stops.length && !v.leg){
      var ct0=S.contracts.filter(function(x){return x.vid===v.id})[0];
      if(ct0){
        var nextFrom=v.loc, nextTo=(v.loc===ct0.from?ct0.to:ct0.from);
        v.loc=nextFrom; v.load=0;
        var q0=P[nextFrom], t0=S.t, dk0=dist(nextFrom,nextTo), vv0=vt(v);
        v.stops=[
          {c:nextTo,t:"p",j:{id:9999,from:nextFrom,to:nextTo,kg:ct0.kg,pay:ct0.pay,due:1e12,pen:0}},
          {c:nextTo,t:"d",j:{id:9999,from:nextFrom,to:nextTo,kg:ct0.kg,pay:ct0.pay,due:1e12,pen:0}}
        ];
        v.leg={la:q0.la,lo:q0.lo,t0:t0,t1:t0+dk0/vv0.spd*60};
        logm("Sözleşmeli sefer devam ediyor: "+P[nextFrom].n+" → "+P[nextTo].n);
      }
    }
  });
  S.vehicles.forEach(function(v){if(v.svcUntil&&S.t>=v.svcUntil){v.svcUntil=0;ch=true;logm("🔧 Bakım tamamlandı: "+vt(v).short+" #"+v.id)}});
  while(S.t>=S.mk.t){mkStep();S.mk.t+=60;if(tab==="banka")ch=true}
  while(S.t>=S.nextJob){fillJobs();S.nextJob+=15}
  var n=S.jobs.length;S.jobs=S.jobs.filter(function(j){return j.due>S.t});if(S.jobs.length<n)fillJobs(false,true);if(tab==="isler"&&jobTab==="spot"){var sg=jobCity===null?Math.floor(S.t/60):S.jobs.filter(function(j){return j.from===jobCity}).map(function(j){return j.id}).join();if(sg!==jSig){jSig=sg;ch=true}}
  if(ch){save();view();live()}else{head();live()}},1000);
setInterval(function(){if(S)save()},10000);
var old=load();if(old&&old.name){S=old;S.paused=false;begin();live()}
</script>
